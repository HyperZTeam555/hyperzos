        document.body.appendChild(editBanner);

        const removeZone = document.createElement('div');
        removeZone.id = 'mobile-edit-remove-zone';
        removeZone.innerHTML = '🗑️ Remove';
        document.body.appendChild(removeZone);

        // Bottom nav bar (3-button Android)
        const navBar = document.createElement('div');
        navBar.id = 'mobile-nav-bar';
        navBar.innerHTML = `
            <div class="nav-btn" id="nav-back" title="Back">
                <svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 5L8 12l12 7V5z" fill="currentColor"/></svg>
            </div>
            <div class="nav-btn" id="nav-home" title="Home">
                <svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
            </div>
            <div class="nav-btn" id="nav-recents" title="Recent">
                <svg width="12" height="12" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
            </div>
        `;
        document.body.appendChild(navBar);

        // Populate
        this.renderHomeApps();
        this.renderDrawerApps();
        this.renderDock();
        this.renderNotifications();
        this.renderQuickToggles();

        // Wire nav buttons with ripple
        const wireNav = (sel, handler) => {
            const btn = navBar.querySelector(sel);
            if (!btn) return;
            btn.addEventListener('pointerdown', (e) => this._addRipple(btn, e.clientX, e.clientY));
            btn.addEventListener('click', (e) => { e.stopPropagation(); handler.call(this); });
        };
        wireNav('#nav-back', this.handleBack);
        wireNav('#nav-home', this.handleHome);
        wireNav('#nav-recents', this.toggleRecents);

        // Home search opens Search app
        home.querySelector('#mobile-home-search').addEventListener('click', () => this.openApp('search'));

        // Tap status bar to open notifications
        statusBar.addEventListener('click', () => this.openNotificationShade());

        // Tap outside overlay content to close
        notif.addEventListener('click', (e) => { if (e.target === notif) this.closeNotificationShade(); });
        drawer.addEventListener('click', (e) => { if (e.target === drawer || (e.target.classList && e.target.classList.contains('drawer-title'))) this.closeAppDrawer(); });
        switcher.addEventListener('click', (e) => { if (e.target === switcher) this.closeRecents(); });

        // Long-press on home screen background → enter edit mode
        this._bindHomeLongPress(home);

        // Double-tap on empty home screen in edit mode → exit edit mode
        let lastTap = 0;
        home.addEventListener('click', (e) => {
            if (!this.editMode) return;
            if (e.target.closest('.mobile-app-icon') || e.target.closest('#mobile-dock') ||
                e.target.closest('#mobile-home-search') || e.target.closest('#mobile-at-glance') ||
                e.target.closest('#mobile-page-dots')) return;
            var now = Date.now();
            if (now - lastTap < 350) {
                this.exitEditMode();
                this._vibrate(10);
            }
            lastTap = now;
        });
    },

    _bindHomeLongPress(home) {
        let startX = 0, startY = 0;
        const startLP = (x, y) => {
            startX = x; startY = y;
            clearTimeout(this._homeLPTimer);
            this._homeLPTimer = setTimeout(() => {
                if (!this.editMode && !this._drag.active) {
                    this._lpSuppressed = true;
                    this.enterEditMode();
                    this._vibrate(20);
                }
            }, 500);
        };
        const cancelLP = () => { clearTimeout(this._homeLPTimer); };
        const moveCancel = (e) => {
            const t = e.touches ? e.touches[0] : e;
            if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) cancelLP();
        };
        const isBackground = (target) => {
            return !target.closest('.mobile-app-icon') &&
                   !target.closest('#mobile-dock') &&
                   !target.closest('#mobile-home-search') &&
                   !target.closest('#mobile-at-glance') &&
                   !target.closest('#mobile-page-dots');
        };

        home.addEventListener('touchstart', (e) => {
            if (this.editMode || this._drag.active) return;
            if (e.touches.length !== 1) return;
            if (!isBackground(e.target)) return;
            startLP(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        home.addEventListener('touchmove', moveCancel, { passive: true });
        home.addEventListener('touchend', cancelLP, { passive: true });
        home.addEventListener('touchcancel', cancelLP, { passive: true });

        // Mouse fallback (desktop testing)
        home.addEventListener('mousedown', (e) => {
            if (this.editMode || this._drag.active) return;
            if (!isBackground(e.target)) return;
            startLP(e.clientX, e.clientY);
        });
        home.addEventListener('mousemove', moveCancel);
        home.addEventListener('mouseup', cancelLP);
        home.addEventListener('mouseleave', cancelLP);
    },

    makeAppIcon(app, opts) {
        // Backward-compatible: makeAppIcon(app, true) means drawer
        if (typeof opts === 'boolean') opts = opts ? { context: 'drawer' } : {};
        opts = opts || {};
        const context = opts.context || 'home';
        const icon = document.createElement('div');
        icon.className = 'mobile-app-icon';
        icon.dataset.appId = app.id;
        const iconFn = Apps.icons[app.iconSvg];
        const svg = iconFn ? iconFn(28) : Apps.icons.info(28);
        icon.innerHTML = `
            <div class="app-icon-bg" style="background:${app.color};color:#fff;">${svg}</div>
            <div class="app-icon-label">${escapeHtml(app.name)}</div>
        `;
        icon.addEventListener('click', (e) => {
            e.stopPropagation();
            if (this._longPressTriggered) { this._longPressTriggered = false; return; }
            if (this.editMode) return; // in edit mode, tap does nothing (drag instead)
            this.openApp(app.id);
            if (context === 'drawer') this.closeAppDrawer();
        });

        const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        const startLP = (x, y) => {
            this._longPressTriggered = false;
            clearTimeout(this._lpTimer);
            this._lpTimer = setTimeout(() => {
                this._longPressTriggered = true;
                this._lpSuppressed = true;
                icon.classList.add('long-pressing');
                this._vibrate(20);
                if (context === 'drawer') {
                    // Long-press in drawer → start drag to home screen
                    this._startDrag(app.id, 'drawer', icon, x, y);
                } else if (this.editMode) {
                    // In edit mode → start drag to reposition
                    this._startDrag(app.id, 'home', icon, x, y);
                } else {
                    // Otherwise → show context menu
                    this.showLongPressMenu(app, icon);
                }
            }, isTouch ? 500 : 600);
        };
        const cancelLP = () => {
            clearTimeout(this._lpTimer);
            icon.classList.remove('long-pressing');
        };

        if (isTouch) {
            icon.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                startLP(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            icon.addEventListener('touchmove', () => { if (this._drag.active) return; cancelLP(); }, { passive: true });
            icon.addEventListener('touchend', cancelLP, { passive: true });
            icon.addEventListener('touchcancel', cancelLP, { passive: true });
        } else {
            icon.addEventListener('mousedown', (e) => { if (e.button === 0) startLP(e.clientX, e.clientY); });
            icon.addEventListener('mouseup', cancelLP);
            icon.addEventListener('mouseleave', () => { if (this._drag.active) return; cancelLP(); });
            icon.addEventListener('mousemove', () => { if (this._drag.active) return; cancelLP(); });
        }
        return icon;
    },

    renderHomeApps() {
        const grid = document.getElementById('mobile-app-grid');
        if (!grid) return;
        grid.innerHTML = '';
        const ids = this.homeScreenApps || this.appsList.map(a => a.id).filter(id => !this.dockApps.includes(id));
        ids.forEach(id => {
            const app = this.appsList.find(a => a.id === id);
            if (app) grid.appendChild(this.makeAppIcon(app, { context: 'home' }));
        });
    },

    renderDrawerApps() {
        const grid = document.getElementById('mobile-drawer-grid');
        if (!grid) return;
        grid.innerHTML = '';
        this.appsList.forEach(app => grid.appendChild(this.makeAppIcon(app, { context: 'drawer' })));
    },

    renderDock() {
        const dock = document.getElementById('mobile-dock');
        if (!dock) return;
        dock.innerHTML = '';
        this.dockApps.forEach(id => {
            const app = this.appsList.find(a => a.id === id);
            if (app) dock.appendChild(this.makeAppIcon(app, { context: 'dock' }));
        });
    },

    renderQuickToggles() {
        const container = document.getElementById('mobile-quick-toggles');
        if (!container) return;
        container.innerHTML = '';
        this.quickToggles.forEach(qt => {
            const el = document.createElement('div');
            el.className = 'notif-qt' + (qt.active ? ' active' : '');
            el.innerHTML = `<div style="font-size:18px;">${qt.icon}</div><div>${escapeHtml(qt.label)}</div>`;
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                qt.active = !qt.active;
                el.classList.toggle('active', qt.active);
                Toast.show(`${qt.label}: ${qt.active ? 'On' : 'Off'}`);
                this._vibrate(10);
            });
            container.appendChild(el);
        });
    },

    renderNotifications() {
        const list = document.getElementById('mobile-notif-list');
        if (!list) return;
        list.innerHTML = '';
        if (this.notifications.length === 0) {
            list.innerHTML = '<div style="text-align:center;opacity:0.5;padding:32px;font-size:13px;">No notifications</div>';
            return;
        }
        this.notifications.forEach((n, idx) => {
            const card = document.createElement('div');
            card.className = 'notif-card';
            card.innerHTML = `
                <div class="notif-icon">${escapeHtml(n.icon)}</div>
                <div style="flex:1;">
                    <div class="notif-title">${escapeHtml(n.title)}</div>
                    <div class="notif-body">${escapeHtml(n.body)}</div>
                    <div style="font-size:10px;opacity:0.6;margin-top:4px;">${escapeHtml(n.app)} · ${escapeHtml(n.time)}</div>
                </div>
                <div data-dismiss="${idx}" style="cursor:pointer;opacity:0.6;font-size:14px;padding:4px 8px;">✕</div>
            `;
            card.querySelector('[data-dismiss]').addEventListener('click', (e) => {
                e.stopPropagation();
                this._dismissNotification(idx);
            });
            // Swipe left/right to dismiss (touch + mouse)
            var nStartX = 0, nTracking = false;
            var nStart = function(e) {
                var x = e.touches ? e.touches[0].clientX : e.clientX;
                nStartX = x; nTracking = true;
                card.style.transition = 'none';
            };
            var nMove = function(e) {
                if (!nTracking) return;
                var x = e.touches ? e.touches[0].clientX : e.clientX;
                var dx = x - nStartX;
                card.style.transform = 'translateX(' + dx + 'px)';
                card.style.opacity = String(Math.max(0.3, 1 - Math.abs(dx) / 300));
            };
            var nEnd = function(e) {
                if (!nTracking) return;
                nTracking = false;
                var x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                var dx = x - nStartX;
                card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                if (Math.abs(dx) > 80) {
                    // Dismiss
                    card.style.transform = 'translateX(' + (dx > 0 ? '100%' : '-100%') + ')';
                    card.style.opacity = '0';
                    setTimeout(function() {
                        this._dismissNotification(idx);
                    }.bind(this), 300);
                } else {
                    // Snap back
                    card.style.transform = '';
                    card.style.opacity = '';
                }
            }.bind(this);
            card.addEventListener('touchstart', nStart, {passive: true});
            card.addEventListener('touchmove', nMove, {passive: true});
            card.addEventListener('touchend', nEnd, {passive: true});
            card.addEventListener('mousedown', function(e) {
                if (e.button !== 0) return;
                nStart(e);
                var mm = function(ev) { nMove(ev); };
                var mu = function(ev) { nEnd(ev); document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); };
                document.addEventListener('mousemove', mm);
                document.addEventListener('mouseup', mu);
            });
            list.appendChild(card);
        });
    },

    _dismissNotification(idx) {
        this.notifications.splice(idx, 1);
        this.renderNotifications();
        this._vibrate(10);
    },

    openApp(appId) {
        this.closeLongPressMenu();
        this.exitEditMode();
        const home = document.getElementById('mobile-home-screen');
        if (home) home.classList.add('hidden');
        try { Apps.open(appId); } catch(e) { console.error(e); }
        this._vibrate(8);
    },

    handleBack() {
        // Close overlays first
        const lpMenu = document.getElementById('mobile-longpress-menu');
        if (lpMenu && lpMenu.classList.contains('open')) { this.closeLongPressMenu(); return; }
        const drawer = document.getElementById('mobile-app-drawer');
        if (drawer && drawer.classList.contains('open')) { this.closeAppDrawer(); return; }
        const notif = document.getElementById('mobile-notification-shade');
        if (notif && notif.classList.contains('open')) { this.closeNotificationShade(); return; }
        const sw = document.getElementById('mobile-app-switcher');
        if (sw && sw.classList.contains('open')) { this.closeRecents(); return; }
        if (this.editMode) { this.exitEditMode(); return; }
        // Minimise foreground window (don't close it) so it stays in Recents
        if (WM.activeId && WM.windows.has(WM.activeId)) {
            try { WM.minimize(WM.activeId); } catch(e) {}
            const home = document.getElementById('mobile-home-screen');
            if (home) home.classList.remove('hidden');
            this._vibrate(8);
        }
    },

    handleHome() {
        this.closeAppDrawer();
        this.closeNotificationShade();
        this.closeRecents();
        this.closeLongPressMenu();
        this.exitEditMode();
        // Minimise the current foreground window only (don't close all)
        if (WM.activeId && WM.windows.has(WM.activeId)) {
            try { WM.minimize(WM.activeId); } catch(e) {}
        }
        const home = document.getElementById('mobile-home-screen');
        if (home) home.classList.remove('hidden');
        this._vibrate(8);
    },

    toggleRecents() {
        const sw = document.getElementById('mobile-app-switcher');
        if (!sw) return;
        if (sw.classList.contains('open')) this.closeRecents();
        else this.openRecents();
    },

    openRecents() {
        const sw = document.getElementById('mobile-app-switcher');
        if (!sw) return;
        this.closeAppDrawer();
        this.closeNotificationShade();
        this.closeLongPressMenu();
        sw.innerHTML = '';
        const entries = Array.from(WM.windows.entries());
        if (entries.length === 0) {
            sw.innerHTML = '<div class="recent-empty">No recent apps</div>';
        } else {
            entries.forEach(([wid, m]) => {
                const card = document.createElement('div');
                card.className = 'recent-app-card';
                card.setAttribute('data-wid', wid);
                const app = this.appsList.find(a => a.id === m.appId) || { name: m.title || 'App', color: '#6b7280', iconSvg: 'info' };
                const iconFn = Apps.icons[app.iconSvg];
                const svg = iconFn ? iconFn(14) : '';
                card.innerHTML = `
                    <div class="recent-app-header">
                        <div style="width:22px;height:22px;border-radius:6px;background:${app.color};display:flex;align-items:center;justify-content:center;color:#fff;">${svg}</div>
                        <span style="flex:1;">${escapeHtml(m.title || app.name)}</span>
                        <span data-close="${wid}" style="cursor:pointer;opacity:0.7;font-size:14px;padding:4px 8px;">✕</span>
                    </div>
                    <div class="recent-app-body">${svg || '📱'}</div>
                `;
                card.querySelector('.recent-app-body').addEventListener('click', (e) => {
                    // Only open if this was a tap, not a drag/scroll
                    if (card.dataset.wasDragged === '1') {
                        card.dataset.wasDragged = '0';
                        return;
                    }
                    this.closeRecents();
                    this._restoreApp(wid, m.minimized);
                    const home = document.getElementById('mobile-home-screen');
                    if (home) home.classList.add('hidden');
                });
                // Swipe up on card to close (touch + mouse)
                var cardStartX = 0, cardStartY = 0, cardTracking = false;
                var cardStart = function(e) {
                    var x = e.touches ? e.touches[0].clientX : e.clientX;
                    var y = e.touches ? e.touches[0].clientY : e.clientY;
                    cardStartX = x; cardStartY = y; cardTracking = true;
                    card.dataset.wasDragged = '0';
                };
                var cardEnd = function(e) {
                    if (!cardTracking) return;
                    cardTracking = false;
                    var x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                    var y = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                    var dx = x - cardStartX, dy = y - cardStartY;
                    // Mark as dragged if moved significantly (prevents click from firing)
                    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                        card.dataset.wasDragged = '1';
                    }
                    // Only close on vertical swipe up (not horizontal scroll)
                    if (dy < -50 && Math.abs(dy) > Math.abs(dx)) {
                        card.classList.add('closing');
                        this._vibrate(15);
                        setTimeout(function() {
                            try { WM.close(wid); } catch(err) {}
                            // Force-delete from WM.windows immediately — WM.close has an
                            // internal 200ms delay which would cause WM.windows.size
                            // to still be 1 when we check below, re-creating the card.
                            WM.windows.delete(wid);
                            // Remove just this card from the DOM (don't rebuild all)
                            card.remove();
                            // If no more windows, close recents and go home
                            if (WM.windows.size === 0) {
                                this.closeRecents();
                                var home = document.getElementById('mobile-home-screen');
                                if (home) home.classList.remove('hidden');
                            } else {
                                // If no cards left in DOM but windows exist, rebuild
                                var remaining = document.querySelectorAll('.recent-app-card');
                                if (remaining.length === 0) this.openRecents();
                            }
                        }.bind(this), 350);
                    }
                }.bind(this);
                card.addEventListener('touchstart', cardStart, {passive: true});
                card.addEventListener('touchend', cardEnd, {passive: true});
                card.addEventListener('mousedown', function(e) {
                    if (e.button !== 0) return;
                    cardStart(e);
                    var moveHandler = function(ev) {
                        // Track but don't preventDefault
                    };
                    var upHandler = function(ev) {
                        cardEnd(ev);
                        document.removeEventListener('mouseup', upHandler);
                        document.removeEventListener('mousemove', moveHandler);
                    };
                    document.addEventListener('mouseup', upHandler);
                    document.addEventListener('mousemove', moveHandler);
                });
                card.querySelector('[data-close]').addEventListener('click', (e) => {
                    e.stopPropagation();
                    card.classList.add('closing');
                    setTimeout(() => {
                        try { WM.close(wid); } catch(err) {}
                        // Force-delete from WM.windows immediately (see swipe handler for explanation)
                        WM.windows.delete(wid);
                        card.remove();
                        if (WM.windows.size === 0) {
                            this.closeRecents();
                            var home = document.getElementById('mobile-home-screen');
                            if (home) home.classList.remove('hidden');
                        } else {
                            var remaining = document.querySelectorAll('.recent-app-card');
                            if (remaining.length === 0) this.openRecents();
                        }
                    }, 280);
                });
                sw.appendChild(card);
            });
        }
        sw.classList.add('open');
        this._vibrate(8);
    },

    _restoreApp(wid, wasMinimized) {
        const w = document.getElementById(wid);
        // Force animation to replay by removing & reflowing anim-open class
        if (w) {
            w.classList.remove('anim-open');
            void w.offsetWidth;
        }
        try {
            if (wasMinimized) WM.restore(wid); else WM.focus(wid);
        } catch(e) {}
    },

    closeRecents() {
        const sw = document.getElementById('mobile-app-switcher');
        if (sw) sw.classList.remove('open');
    },

    openAppDrawer() {
        const d = document.getElementById('mobile-app-drawer');
        if (d) d.classList.add('open');
        this.closeNotificationShade();
        this.closeRecents();
        this.closeLongPressMenu();
        this._vibrate(8);
    },

    closeAppDrawer() {
        const d = document.getElementById('mobile-app-drawer');
        if (d) d.classList.remove('open');
    },

    openNotificationShade() {
        const n = document.getElementById('mobile-notification-shade');
        if (!n) return;
        n.classList.add('open');
        const now = new Date();
        const dateEl = document.getElementById('mobile-notif-date');
        if (dateEl) dateEl.textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
        const timeEl = document.getElementById('mobile-notif-time');
        if (timeEl) timeEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        this._vibrate(8);
    },

    closeNotificationShade() {
        const n = document.getElementById('mobile-notification-shade');
        if (n) n.classList.remove('open');
    },

    showLongPressMenu(app, iconEl) {
        const menu = document.getElementById('mobile-longpress-menu');
        if (!menu) return;
        const inDock = this.dockApps.includes(app.id);
        const inHome = this.homeScreenApps && this.homeScreenApps.includes(app.id);
        menu.innerHTML = `
            <div class="lp-item" data-action="open"><span style="font-size:16px;">📂</span> Open</div>
            <div class="lp-item" data-action="dock"><span style="font-size:16px;">📌</span> ${inDock ? 'Remove from Dock' : 'Add to Dock'}</div>
            ${inHome ? '<div class="lp-item" data-action="remove-home"><span style="font-size:16px;">🚫</span> Remove from Home</div>' : '<div class="lp-item" data-action="add-home"><span style="font-size:16px;">➕</span> Add to Home</div>'}
            <div class="lp-item" data-action="uninstall"><span style="font-size:16px;">🗑️</span> Uninstall</div>
            <div class="lp-item" data-action="info"><span style="font-size:16px;">ℹ️</span> App Info</div>
        `;
        const rect = iconEl.getBoundingClientRect();
        let left = rect.left + rect.width/2 - 90;
        let top = rect.bottom + 8;
        left = Math.max(8, Math.min(window.innerWidth - 188, left));
        if (top + 280 > window.innerHeight) top = Math.max(40, rect.top - 280 - 8);
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
        menu.classList.add('open');
        menu.querySelectorAll('.lp-item').forEach(item => {
            item.addEventListener('click', (ev) => {
                ev.stopPropagation();
                const action = item.dataset.action;
                this.closeLongPressMenu();
                iconEl.classList.remove('long-pressing');
                if (action === 'open') {
                    this.openApp(app.id);
                } else if (action === 'dock') {
                    if (inDock) {
                        this.dockApps = this.dockApps.filter(id => id !== app.id);
                        Toast.show(`${app.name} removed from dock`);
                    } else if (this.dockApps.length < 5) {
                        this.dockApps.push(app.id);
                        Toast.show(`${app.name} added to dock`);
                    } else {
                        Toast.show('Dock is full (max 5)');
                    }
                    this.renderHomeApps();
                    this.renderDock();
                } else if (action === 'remove-home') {
                    this.removeFromHome(app.id);
                    this.renderHomeApps();
                    Toast.show(`${app.name} removed from home`);
                } else if (action === 'add-home') {
                    if (!this.homeScreenApps.includes(app.id)) {
                        this.homeScreenApps.push(app.id);
                        this.renderHomeApps();
                        Toast.show(`${app.name} added to home`);
                    }
                } else if (action === 'uninstall') {
                    Toast.show(`Cannot uninstall built-in app: ${app.name}`);
                } else if (action === 'info') {
                    Toast.show(`<strong>${app.name}</strong><br>HyperZOS built-in app<br>Version 3.1`);
                }
                this._vibrate(10);
            });
        });
        // Outside-click dismiss
        setTimeout(() => {
            const handler = (e) => {
                if (!menu.contains(e.target)) {
                    this.closeLongPressMenu();
                    iconEl.classList.remove('long-pressing');
                    document.removeEventListener('touchstart', handler, true);
                    document.removeEventListener('mousedown', handler, true);
                }
            };
            document.addEventListener('touchstart', handler, { passive: true, capture: true });
            document.addEventListener('mousedown', handler, true);
        }, 150);
    },

    closeLongPressMenu() {
        const menu = document.getElementById('mobile-longpress-menu');
        if (menu) menu.classList.remove('open');
    },

    _switchPage(dir) {
        this._currentHome = (this._currentHome + dir + 3) % 3;
        const dots = document.querySelectorAll('#mobile-page-dots .dot');
        dots.forEach((d, i) => d.classList.toggle('active', i === this._currentHome));
        const grid = document.getElementById('mobile-app-grid');
        if (grid) {
            const out = dir > 0 ? '-8%' : '8%';
            const in_ = dir > 0 ? '8%' : '-8%';
            grid.style.transition = 'transform 0.22s cubic-bezier(0.4,0,1,1), opacity 0.22s';
            grid.style.opacity = '0.25';
            grid.style.transform = `translateX(${out})`;
            setTimeout(() => {
                grid.style.transition = 'none';
                grid.style.transform = `translateX(${in_})`;
                requestAnimationFrame(() => {
                    grid.style.transition = 'transform 0.28s cubic-bezier(0.16,1,0.3,1), opacity 0.28s';
                    grid.style.transform = '';
                    grid.style.opacity = '';
                });
            }, 220);
        }
        this._vibrate(5);
    },

    _flashEdge(side) {
        const el = document.createElement('div');
        el.className = 'mobile-edge-flash ' + side;
        document.body.appendChild(el);
        requestAnimationFrame(() => { el.style.opacity = '0'; });
        setTimeout(() => el.remove(), 400);
    },

    bindGestures() {
        const SWIPE_THRESHOLD = 50;
        const EDGE = 22;
        let startX = 0, startY = 0;
        let startZone = null;
        let tracking = false;

        const getZones = () => {
            const sbH = parseInt(getComputedStyle(document.body).getPropertyValue('--statusbar-h')) || 28;
            const nbH = parseInt(getComputedStyle(document.body).getPropertyValue('--navbar-h')) || 44;
            return { sbH, nbH };
        };

        const classifyStart = (x, y) => {
            const { sbH, nbH } = getZones();
            if (y < sbH) return 'top';
            if (y > window.innerHeight - nbH) return 'bottom';
            if (x < EDGE) return 'left';
            if (x > window.innerWidth - EDGE) return 'right';
            return 'middle';
        };

        const handleEnd = (endX, endY, targetEl) => {
            if (!tracking) return;
            tracking = false;
            if (this._lpSuppressed || this._drag.active) {
                this._lpSuppressed = false;
                return;
            }
            const dx = endX - startX, dy = endY - startY;
            const absDx = Math.abs(dx), absDy = Math.abs(dy);
            const horiz = absDx > absDy;

            // Use elementFromPoint to find what's actually under the end position
            // (more reliable than e.target which might be a different element after movement)
            var endTarget = document.elementFromPoint(endX, endY);

            // Check if notification shade is open — swipe up to close it
            const notif = document.getElementById('mobile-notification-shade');
            if (notif && notif.classList.contains('open')) {
                if (dy < -SWIPE_THRESHOLD && absDy > absDx) {
                    this.closeNotificationShade(); this._vibrate(10); return;
                }
                return;
            }

            // Check if recents switcher is open — handle card gestures
            const sw = document.getElementById('mobile-app-switcher');
            if (sw && sw.classList.contains('open')) {
                // Swipe up on a recent app card → close that app
                if (dy < -SWIPE_THRESHOLD && absDy > absDx) {
                    // Find the card that was under the START position (more reliable)
                    var startEl = document.elementFromPoint(startX, startY);
                    var cardEl = (endTarget && endTarget.closest && endTarget.closest('.recent-app-card')) ||
                                 (startEl && startEl.closest && startEl.closest('.recent-app-card'));
                    if (cardEl) {
                        var wid = cardEl.getAttribute('data-wid');
                        if (wid) {
                            cardEl.classList.add('closing');
                            this._vibrate(15);
                            setTimeout(() => {
                                try { WM.close(wid); } catch(err) {}
                                // Force-delete from WM.windows immediately (WM.close has internal 200ms delay)
                                WM.windows.delete(wid);
                                cardEl.remove();
                                if (WM.windows.size === 0) {
                                    this.closeRecents();
                                    var home = document.getElementById('mobile-home-screen');
                                    if (home) home.classList.remove('hidden');
                                } else {
                                    var remaining = document.querySelectorAll('.recent-app-card');
                                    if (remaining.length === 0) this.openRecents();
                                }
                            }, 350);
                        }
                    }
                    return;
                }
                // Horizontal swipe in recents → let it scroll naturally
                return;
            }

            // Pull-down from top status bar → notification shade
            if (startZone === 'top' && dy > SWIPE_THRESHOLD && absDy > absDx) {
                this.openNotificationShade(); this._vibrate(10); return;
            }
            // Pull-up from bottom nav bar → home or app drawer
            if (startZone === 'bottom' && dy < -SWIPE_THRESHOLD && absDy > absDx) {
                this._handleSwipeUp(); this._vibrate(10); return;
            }
            // Edge swipe from left → back
            if (startZone === 'left' && dx > SWIPE_THRESHOLD && horiz) {
                this._flashEdge('left'); this.handleBack(); this._vibrate(10); return;
            }
            // Edge swipe from right → back
            if (startZone === 'right' && dx < -SWIPE_THRESHOLD && horiz) {
                this._flashEdge('right'); this.handleBack(); this._vibrate(10); return;
            }
            // Horizontal swipe on home screen → page switch
            if (startZone === 'middle' && horiz && absDx > 70) {
                if (this.editMode) return;
                const drawer = document.getElementById('mobile-app-drawer');
                if (drawer && drawer.classList.contains('open')) return;
                const home = document.getElementById('mobile-home-screen');
                if (home && !home.classList.contains('hidden')) {
                    if (targetEl && targetEl.closest && targetEl.closest('.mobile-app-icon')) return;
                    this._switchPage(dx < 0 ? 1 : -1);
                    return;
                }
            }
            // Swipe up from middle of home screen → open app drawer
            if (startZone === 'middle' && !horiz && dy < -SWIPE_THRESHOLD) {
                if (this.editMode) return;
                const home = document.getElementById('mobile-home-screen');
                if (home && !home.classList.contains('hidden')) {
                    if (targetEl && targetEl.closest && (targetEl.closest('.mobile-app-icon') || targetEl.closest('#mobile-dock') || targetEl.closest('#mobile-home-search'))) return;
                    this.openAppDrawer();
                    this._vibrate(10);
                    return;
                }
            }
            // Swipe DOWN from middle of home screen → open notification shade
            if (startZone === 'middle' && !horiz && dy > SWIPE_THRESHOLD) {
                if (this.editMode) return;
                const drawer = document.getElementById('mobile-app-drawer');
                if (drawer && drawer.classList.contains('open')) {
                    // Swipe down on app drawer → close it (not open notif shade)
                    this.closeAppDrawer(); this._vibrate(10); return;
                }
                const home = document.getElementById('mobile-home-screen');
                if (home && !home.classList.contains('hidden')) {
                    if (targetEl && targetEl.closest && (targetEl.closest('.mobile-app-icon') || targetEl.closest('#mobile-dock') || targetEl.closest('#mobile-home-search'))) return;
                    this.openNotificationShade();
                    this._vibrate(10);
                    return;
                }
            }
        };

        const onStart = (x, y) => {
            if (!this.enabled) return false;
            if (this._drag.active) return false;
            startX = x; startY = y;
            tracking = true;
            startZone = classifyStart(x, y);
            return true;
        };

        // ── Touch events ──
        document.addEventListener('touchstart', (e) => {
            if (!this.enabled) return;
            if (this._drag.active) return;
            if (e.touches.length !== 1) { tracking = false; return; }
            const t = e.touches[0];
            onStart(t.clientX, t.clientY);
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!this.enabled || !tracking) return;
            if (startZone === 'middle') return;
            const target = e.target;
            if (target && target.closest && target.closest('#mobile-app-drawer.open, #mobile-notification-shade.open, #mobile-app-switcher.open')) {
                return;
            }
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (!this.enabled || !tracking) return;
            const t = e.changedTouches[0];
            handleEnd(t.clientX, t.clientY, e.target);
        }, { passive: true });

        document.addEventListener('touchcancel', () => { tracking = false; }, { passive: true });

        // ── Mouse events (for desktop testing and mouse-based interaction) ──
        let mouseTracking = false;
        document.addEventListener('mousedown', (e) => {
            if (!this.enabled) return;
            if (e.button !== 0) return;
            if (this._drag.active) return;
            const target = e.target;
            // Allow gesture tracking inside notification shade and recents (for swipe-to-close)
            const inNotif = target && target.closest && target.closest('#mobile-notification-shade');
            const inRecents = target && target.closest && target.closest('#mobile-app-switcher');
            if (inNotif || inRecents) {
                // Inside these overlays, allow swipe tracking but ignore clicks on buttons/links
                if (target && target.closest && (
                    target.closest('button') ||
                    target.closest('input') ||
                    target.closest('a') ||
                    target.closest('[onclick]')
                )) return;
                mouseTracking = onStart(e.clientX, e.clientY);
                return;
            }
            // Outside overlays: only start gesture tracking on background areas
            if (target && target.closest && (
                target.closest('button') ||
                target.closest('input') ||
                target.closest('textarea') ||
                target.closest('a') ||
                target.closest('.mobile-app-icon') ||
                target.closest('.nav-btn') ||
                target.closest('.notif-qt') ||
                target.closest('.notif-card') ||
                target.closest('.recent-app-card') ||
                target.closest('[onclick]')
            )) return;
            mouseTracking = onStart(e.clientX, e.clientY);
        });

        document.addEventListener('mousemove', (e) => {
            if (!this.enabled || !mouseTracking) return;
            // No preventDefault for mouse — just track
        });

        document.addEventListener('mouseup', (e) => {
            if (!this.enabled || !mouseTracking) return;
            mouseTracking = false;
            handleEnd(e.clientX, e.clientY, e.target);
        });

        // Cancel mouse tracking if mouse leaves the window
        document.addEventListener('mouseleave', () => {
            mouseTracking = false;
            tracking = false;
        });
    },

    _handleSwipeUp() {
        const home = document.getElementById('mobile-home-screen');
        const drawer = document.getElementById('mobile-app-drawer');
        const notif = document.getElementById('mobile-notification-shade');
        const sw = document.getElementById('mobile-app-switcher');
        // Close overlays first
        if (drawer && drawer.classList.contains('open')) { this.closeAppDrawer(); return; }
        if (notif && notif.classList.contains('open')) { this.closeNotificationShade(); return; }
        if (sw && sw.classList.contains('open')) { this.closeRecents(); return; }
        if (this.editMode) { this.exitEditMode(); return; }
        // If an app is in foreground, go home (minimise it to Recents)
        if (WM.activeId && WM.windows.has(WM.activeId)) {
            this.handleHome();
            return;
        }
        // Otherwise (on home) → open app drawer
        if (home && !home.classList.contains('hidden')) {
            this.openAppDrawer();
            return;
        }
        // Fallback: show home
        if (home) home.classList.remove('hidden');
    },

    _vibrate(ms) {
        if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e) {}
    },

    _addRipple(el, x, y) {
        const rect = el.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (x - rect.left - size/2) + 'px';
        ripple.style.top = (y - rect.top - size/2) + 'px';
        el.appendChild(ripple);
        setTimeout(() => { try { ripple.remove(); } catch(e) {} }, 650);
    },

    _initBattery() {
        if (navigator.getBattery) {
            try {
                navigator.getBattery().then(battery => {
                    const update = () => {
                        const bat = document.getElementById('mobile-battery');
                        if (bat) bat.textContent = Math.round(battery.level * 100) + '%';
                    };
                    update();
                    battery.addEventListener('levelchange', update);
                }).catch(() => {});
            } catch(e) {}
        }
    },

    enterEditMode() {
        if (this.editMode) return;
        this.editMode = true;
        const home = document.getElementById('mobile-home-screen');
        if (home) home.classList.add('edit-mode');
        const banner = document.getElementById('mobile-edit-banner');
        if (banner) banner.classList.add('visible');
    },

    exitEditMode() {
        if (!this.editMode) return;
        this.editMode = false;
        const home = document.getElementById('mobile-home-screen');
        if (home) home.classList.remove('edit-mode');
        const banner = document.getElementById('mobile-edit-banner');
        if (banner) banner.classList.remove('visible');
        const rz = document.getElementById('mobile-edit-remove-zone');
        if (rz) rz.classList.remove('visible', 'over');
    },

    _startDrag(appId, source, iconEl, x, y) {
        if (this._drag.active) return;
        const app = this.appsList.find(a => a.id === appId);
        if (!app) return;
        this._drag = { active: true, appId, source, sourceIcon: iconEl, ghost: null, startX: x, startY: y };
        // Build floating ghost
        const ghost = document.createElement('div');
        ghost.className = 'mobile-app-icon drag-ghost';
        const iconFn = Apps.icons[app.iconSvg];
        const svg = iconFn ? iconFn(28) : '';
        ghost.innerHTML = `
            <div class="app-icon-bg" style="background:${app.color};color:#fff;">${svg}</div>
            <div class="app-icon-label">${escapeHtml(app.name)}</div>
        `;
        ghost.style.left = (x - 28) + 'px';
        ghost.style.top = (y - 50) + 'px';
        document.body.appendChild(ghost);
        this._drag.ghost = ghost;
        iconEl.classList.add('dragging');

        if (source === 'drawer') {
            this.closeAppDrawer();
            const home = document.getElementById('mobile-home-screen');
            if (home) home.classList.remove('hidden');
            this.enterEditMode();
        }
        if (source === 'home') {
            const rz = document.getElementById('mobile-edit-remove-zone');
            if (rz) rz.classList.add('visible');
        }

        this._dragMoveHandler = (e) => {
            if (!this._drag.active) return;
            const t = e.touches ? e.touches[0] : e;
            if (this._drag.ghost) {
                this._drag.ghost.style.left = (t.clientX - 28) + 'px';
                this._drag.ghost.style.top = (t.clientY - 50) + 'px';
            }
            this._updateDropTarget(t.clientX, t.clientY);
            if (e.cancelable) e.preventDefault();
        };
        this._dragEndHandler = (e) => {
            if (!this._drag.active) return;
            const t = (e && e.changedTouches) ? e.changedTouches[0] : (e || {});
            const x = t.clientX != null ? t.clientX : this._drag.startX;
            const y = t.clientY != null ? t.clientY : this._drag.startY;
            this._endDrag(x, y);
        };
        document.addEventListener('touchmove', this._dragMoveHandler, { passive: false });
        document.addEventListener('touchend', this._dragEndHandler, { passive: true });
        document.addEventListener('touchcancel', this._dragEndHandler, { passive: true });
        document.addEventListener('mousemove', this._dragMoveHandler);
        document.addEventListener('mouseup', this._dragEndHandler);
        this._vibrate(15);
    },

    _updateDropTarget(x, y) {
        const el = document.elementFromPoint(x, y);
        if (!el) return;
        const overDock = !!el.closest('#mobile-dock');
        const overRZ = !!el.closest('#mobile-edit-remove-zone');
        const overGrid = !!el.closest('#mobile-app-grid');
        const dock = document.getElementById('mobile-dock');
        const rz = document.getElementById('mobile-edit-remove-zone');
        const grid = document.getElementById('mobile-app-grid');
        if (dock) dock.classList.toggle('drop-target', overDock);
        if (rz) rz.classList.toggle('over', overRZ);
        if (grid) grid.classList.toggle('drop-target', overGrid && this._drag.source === 'drawer');
    },

    _endDrag(x, y) {
        if (!this._drag.active) return;
        const { appId, source, ghost, sourceIcon } = this._drag;

        if (this._dragMoveHandler) {
            document.removeEventListener('touchmove', this._dragMoveHandler);
            document.removeEventListener('mousemove', this._dragMoveHandler);
        }
        if (this._dragEndHandler) {
            document.removeEventListener('touchend', this._dragEndHandler);
            document.removeEventListener('touchcancel', this._dragEndHandler);
            document.removeEventListener('mouseup', this._dragEndHandler);
        }
        if (ghost) ghost.remove();
        if (sourceIcon) sourceIcon.classList.remove('dragging');

        const targetEl = document.elementFromPoint(x, y);
        if (targetEl) {
            const removeZone = targetEl.closest('#mobile-edit-remove-zone');
            const dock = targetEl.closest('#mobile-dock');
            const homeGrid = targetEl.closest('#mobile-app-grid');
            if (removeZone && source === 'home') {
                this.removeFromHome(appId);
                this.renderHomeApps();
                this._vibrate(20);
            } else if (dock) {
                this.addToDock(appId);
                this._vibrate(15);
            } else if (homeGrid || source === 'drawer') {
                if (source === 'drawer') this.addToHomeAt(appId, x, y);
                else this.moveHomeApp(appId, x, y);
                this._vibrate(15);
            }
        }

        const rz = document.getElementById('mobile-edit-remove-zone');
        if (rz) rz.classList.remove('visible', 'over');
        const dockEl = document.getElementById('mobile-dock');
        if (dockEl) dockEl.classList.remove('drop-target');
        const gridEl = document.getElementById('mobile-app-grid');
        if (gridEl) gridEl.classList.remove('drop-target');

        this._drag = { active: false };
        this._dragMoveHandler = null;
        this._dragEndHandler = null;

        this.renderHomeApps();
        this.renderDock();

        // If we entered edit mode just for this drawer drag, exit it
        if (source === 'drawer') this.exitEditMode();
    },

    _nearestSlot(x, y) {
        const grid = document.getElementById('mobile-app-grid');
        if (!grid) return this.homeScreenApps.length;
        const rect = grid.getBoundingClientRect();
        const cols = 4;
        const slotWidth = rect.width / cols;
        const slotHeight = 90;
        const relY = y - rect.top + (grid.scrollTop || 0);
        const relX = x - rect.left;
        let col = Math.floor(relX / slotWidth);
        col = Math.max(0, Math.min(cols - 1, col));
        let row = Math.floor(relY / slotHeight);
        row = Math.max(0, row);
        return Math.min(row * cols + col, this.homeScreenApps.length);
    },

    addToHomeAt(appId, x, y) {
        if (this.homeScreenApps.includes(appId)) {
            this.moveHomeApp(appId, x, y);
            return;
        }
        const idx = this._nearestSlot(x, y);
        this.homeScreenApps.splice(idx, 0, appId);
    },

    moveHomeApp(appId, x, y) {
        const currentIndex = this.homeScreenApps.indexOf(appId);
        if (currentIndex === -1) return;
        let targetIndex = this._nearestSlot(x, y);
        if (targetIndex === currentIndex) return;
        this.homeScreenApps.splice(currentIndex, 1);
        if (targetIndex > currentIndex) targetIndex = Math.max(0, targetIndex - 1);
        targetIndex = Math.min(targetIndex, this.homeScreenApps.length);
        this.homeScreenApps.splice(targetIndex, 0, appId);
    },

    removeFromHome(appId) {
        if (this.homeScreenApps) {
            this.homeScreenApps = this.homeScreenApps.filter(id => id !== appId);
        }
    },

    addToDock(appId) {
        if (this.dockApps.includes(appId)) return;
        if (this.dockApps.length >= 5) {
            Toast.show('Dock is full (max 5)');
            return;
        }
        this.dockApps.push(appId);
    },

    startClock() {
        if (this._clockInterval) clearInterval(this._clockInterval);
        const update = () => {
            const now = new Date();
            if (this.statusClockEl) {
                this.statusClockEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            const agDate = document.getElementById('mobile-at-glance-date');
            if (agDate) {
                agDate.textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
            }
            const notifTime = document.getElementById('mobile-notif-time');
            if (notifTime) {
                notifTime.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
        };
        update();
        this._clockInterval = setInterval(update, 1000);
    }
};
// Detect mobile and enable. Mobile UI sits behind the boot screen (z-index 9999)
// and is revealed automatically when boot completes.
function _initMobile() {
    try {
        if (Mobile.detect()) Mobile.enable();
    } catch(e) { console.error('Mobile init error:', e); }
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _initMobile);
} else {
    _initMobile();
}
// Auto-enable mobile mode on resize to small screen (like ZMedia's @media approach)
window.addEventListener('resize', function() {
    try {
        if (!Mobile.enabled && Mobile.detect()) Mobile.enable();
    } catch(e) {}
});
</script>
