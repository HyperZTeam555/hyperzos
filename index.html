function makeDraggable(el) {

if (e.button !== 0) return;

initialTop = parseInt(el.style.top) || 0;
el.style.zIndex = 100;
});
window.addEventListener('mousemove', (e) => {
if (!isDragging) return;
const dx = e.clientX - startX, dy = e.clientY - startY;
if (!hasMoved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) hasMoved = true;
if (hasMoved) { el.style.left = (initialLeft + dx) + 'px'; el.style.top = (initialTop + dy) + 'px'; }
});
window.addEventListener('mouseup', () => {
if (isDragging && hasMoved) {
const currentLeft = parseInt(el.style.left) || 0;

el.style.left = snapToGridVal(currentLeft) + 'px';
el.style.top = Math.max(12, snapToGridVal(currentTop)) + 'px';
}
isDragging = false; hasMoved = false;
el.style.zIndex = '';
});
}

iv><div class="proxy-badge frog4" id="badgeFrog4">Frog4</div><div class="proxy-badge frog5" id="badgeFrog5">Frog5</div><div class="proxy-badge frog6" id="badgeFrog6">Frog6</div><div class="proxy-badge allorigins" id="badgeAllorigins">AllOrigins</div><div class="proxy-badge direct" id="badgeDirect">Direct</div><script>let currentProxy='frog';function xorEncode(str){let r='';for(let i=0;i<str.length;i++){if(i%2===1)r+=String.fromCharCode(str.charCodeAt(i)^0x02);else r+=str[i]}return r}function looksLikeUrl(s){return s.includes('.')&&!s.includes(' ')&&(s.startsWith('http')||/^[a-zA-Z0-9-]+\\.[a-zA-Z]{2,}/.test(s))}function updateProxy(){currentProxy=document.getElementById('proxySelect').value;document.querySelectorAll('.proxy-badge').forEach(b=>b.classList.remove('show'))}function navigate(){const input=document.getElementById('urlInput').value.trim();if(!input)return;if(looksLikeUrl(input)){let url=input;if(!url.startsWith('http'))url='https://'+url;url=url.replace(/\\/$/,'');loadSite(url)}else{loadSite('https://duckduckgo.com/?q='+encodeURIComponent(input))}}function loadSite(url){document.getElementById('homeScreen').style.display='none';document.getElementById('proxyFrame').style.display='block';document.getElementById('loader').classList.add('active');let proxyUrl;const encoded=xorEncode(url);const safeEncoded=encodeURIComponent(encoded);switch(currentProxy){case'frog':proxyUrl='https://frogiesarcade.net/frog/default/ixl/'+safeEncoded;showToast('Frog Encrypted',encoded.substring(0,20)+'...');break;case'frog2':proxyUrl='https://frogiesarcade.win/frog/default/ixl/'+safeEncoded;showToast('Frog2',encoded.substring(0,20)+'...');break;case'frog3':proxyUrl='https://full.boxathome.net/frog/default/ixl/'+safeEncoded;showToast('Frog3',encoded.substring(0,20)+'...');break;case'frog4':proxyUrl='https://vcsa-yt.keybusinessconnection.com/frog/default/ixl/'+safeEncoded;showToast('Frog4',encoded.substring(0,20)+'...');break;case'frog5':proxyUrl='https://thetheoryof.twilightparad openCalculator() {
const state = { display: '0', prev: null, op: null, justEval: false, uid: uid() };
const render = (body) => {
body.classList.add('app-calc-body');
body.innerHTML = `
<div class="flex flex-col h-full text-white p-2">
<div class="text-xs text-gray-400 px-2 py-1">Standard</div>
<div id="calc-display-${state.uid}" class="text-right text-4xl font-light p-4 mb-2 overflow-hidden tabular-nums">0</div>
<div class="grid grid-cols-4 gap-1 flex-1">
${['%','CE','C','⌫','1/x','x²','√x','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].map(b => `<button class="rounded ${'0123456789.'.includes(b)?'bg-[rgba(60,60,65,0.4)]':'bg-[rgba(45,45,50,0.4)]'} ${b==='='?'bg-[var(--accent)]':''} hover:brightness-125 text-lg transition-all" data-btn="${b}">${b}</button>`).join('')}
</div>
</div>`;
const display = body.querySelector(`#calc-display-${state.uid}`);
const updateDisplay = () => { display.textContent = state.display; };
body.querySelectorAll('[data-btn]').forEach(b => {
b.addEventListener('click', () => {
const v = b.dataset.btn;
if ('0123456789'.includes(v)) { if (state.display === '0' || state.justEval) { state.display = v; state.justEval = false; } else state.display += v; }
else if (v === '.') { if (state.justEval) { state.display = '0.'; state.justEval = false; } else if (!state.display.includes('.')) state.display += '.'; }
else if (v === 'C') { state.display = '0'; state.prev = null; state.op = null; }
else if (v === 'CE') { state.display = '0'; }
else if (v === '⌫') { state.display = state.display.length > 1 ? state.display.slice(0,-1) : '0'; }
else if (v === '±') { state.display = state.display.startsWith('-') ? state.display.slice(1) : '-' + state.display; }
else if (v === 'x²') { state.display = String(Math.pow(parseFloat(state.display), 2)); }
else if (v === '√x') { const n = parseFloat(state.display); state.display = n >= 0 ? String(Math.sqrt(n)) : 'Error'; }
else if (v === '1/x') { const n = parseFloat(state.display); state.display = n !== 0 ? String(1/n) : 'Error'; }
else if (v === '%') { state.display = String(parseFloat(state.display)/100); }
else if (['+','−','×','÷'].includes(v)) { if (state.prev !== null && state.op && !state.justEval) state.display = String(calcOp(state.prev, parseFloat(state.display), state.op)); state.prev = parseFloat(state.display); state.op = v; state.justEval = true; }
else if (v === '=') { if (state.prev !== null && state.op) { state.display = String(calcOp(state.prev, parseFloat(state.display), state.op)); state.prev = null; state.op = null; state.justEval = true; } }
updateDisplay();
});
});
const calcOp = (a, b, op) => { if (op === '+') return a+b; if (op === '−') return a-b; if (op === '×') return a*b; if (op === '÷') return b===0?'Error':a/b; return b; };
};
WM.create({ appId: 'calculator', title: 'Calculator', icon: Apps.icons.calc(14), width: 320, height: 480, content: render });
},

                <div id="cam-flash-${state.uid}" class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-100"></div>
            </div>
            
            <div id="cam-controls-${state.uid}" class="flex items-center justify-center gap-6 px-4 py-4 bg-[rgba(40,40,45,0.4)] border-t border-white/5" style="backdrop-filter:blur(12px); display:none;">
                <button id="cam-action-btn-${state.uid}" class="w-16 h-16 rounded-full border-4 border-white flex items-center justify-center bg-white hover:brightness-90 transition-colors shadow-lg" title="Take Photo">
                    <div class="w-14 h-14 bg-white rounded-full border-2 border-gray-300"></div>
                </button>
            </div>
        </div>`;
        
        const video = body.querySelector(`#cam-video-${state.uid}`);
        const permissionDiv = body.querySelector(`#cam-permission-${state.uid}`);
        const errorDiv = body.querySelector(`#cam-error-${state.uid}`);
        const statusDiv = body.querySelector(`#cam-status-${state.uid}`);
        const controlsDiv = body.querySelector(`#cam-controls-${state.uid}`);
        const actionBtn = body.querySelector(`#cam-action-btn-${state.uid}`);
        const recordingIndicator = body.querySelector(`#cam-recording-indicator-${state.uid}`);
        const timerSpan = body.querySelector(`#cam-timer-${state.uid}`);
        const flashDiv = body.querySelector(`#cam-flash-${state.uid}`);
        
        const photoBtn = body.querySelector(`#mode-photo-${state.uid}`);
        const videoBtn = body.querySelector(`#mode-video-${state.uid}`);

        let recordingStartTime = 0;
        let recordingInterval = null;

        const setMode = (mode) => {
            state.mode = mode;
            if (mode === 'photo') {
                photoBtn.className = "px-4 py-1 rounded-full text-xs font-bold transition-all bg-[var(--accent)] text-white";
                videoBtn.className = "px-4 py-1 rounded-full text-xs font-bold transition-all bg-white/10 text-gray-300 hover:bg-white/20";
                actionBtn.innerHTML = '<div class="w-14 h-14 bg-white rounded-full border-2 border-gray-300"></div>';
                actionBtn.title = "Take Photo";
                if (state.isRecording) stopRecording();
            } else {
                videoBtn.className = "px-4 py-1 rounded-full text-xs font-bold transition-all bg-[var(--accent)] text-white";
                photoBtn.className = "px-4 py-1 rounded-full text-xs font-bold transition-all bg-white/10 text-gray-300 hover:bg-white/20";
                actionBtn.innerHTML = '<div class="w-6 h-6 bg-red-600 rounded-sm"></div>';
                actionBtn.title = "Start Recording";
            }
        };

        photoBtn.addEventListener('click', () => setMode('photo'));
        videoBtn.addEventListener('click', () => setMode('video'));

        const startCamera = async () => {
            
            errorDiv.classList.add('hidden');
            statusDiv.textContent = 'Requesting...';
            
            if (state.stream) {
                state.stream.getTracks().forEach(track => track.stop());
                state.stream = null;
            }

            try {
                
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                window.currentCameraStream = stream;
                state.stream = stream;
                
                video.srcObject = stream;
                video.style.display = 'block';
                permissionDiv.style.display = 'none';
                controlsDiv.style.display = 'flex';
                
                statusDiv.textContent = '● Ready';
                statusDiv.className = 'text-xs text-green-400';
            } catch (err) {
                console.error("Camera Error:", err);
                let msg = 'Could not access camera.';
                if (err.name === 'NotAllowedError') msg = 'Permission denied. Please allow camera in browser settings.';
                else if (err.name === 'NotFoundError') msg = 'No camera found.';
                else if (err.name === 'NotReadableError') msg = 'Camera is busy. Close other apps using it.';
                
                errorDiv.textContent = msg;
                errorDiv.classList.remove('hidden');
                statusDiv.textContent = 'Error';
                statusDiv.className = 'text-xs text-red-400';
            }
        };

        body.querySelector(`#cam-request-btn-${state.uid}`).addEventListener('click', startCamera);

        const takePhoto = () => {
            if (!state.stream) return;
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            flashDiv.style.opacity = '1';
            setTimeout(() => flashDiv.style.opacity = '0', 100);

            canvas.toBlob((blob) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const filename = `photo_${Date.now()}.png`;
                    if (FS.createFile('C:/Users/Admin/Pictures', filename, 'file', reader.result)) {
                        Toast.show('📸 Photo saved to Pictures');
                    }
                };
                reader.readAsDataURL(blob);
            }, 'image/png');
        };

        const startRecording = () => {
            state.recordedChunks = [];
            try {
                state.mediaRecorder = new MediaRecorder(state.stream, { mimeType: 'video/webm; codecs=vp9,opus' });
            } catch (e) {
                state.mediaRecorder = new MediaRecorder(state.stream);
            }
            state.mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) state.recordedChunks.push(e.data);
            };
            state.mediaRecorder.onstop = () => {
                const blob = new Blob(state.recordedChunks, { type: 'video/webm' });
                const reader = new FileReader();
                reader.onloadend = () => {
                    const filename = `video_${Date.now()}.webm`;
                    if (FS.createFile('C:/Users/Admin/Downloads', filename, 'file', reader.result)) {
                        Toast.show('🎥 Video saved to Downloads');
                    }
                };
                reader.readAsDataURL(blob);
            };
            state.mediaRecorder.start();
            state.isRecording = true;
            actionBtn.innerHTML = '<div class="w-6 h-6 bg-white rounded-sm"></div>';
            actionBtn.classList.add('border-red-800');
            recordingIndicator.classList.remove('hidden');
            recordingStartTime = Date.now();
            recordingInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
                const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const s = (elapsed % 60).toString().padStart(2, '0');
                timerSpan.textContent = `${m}:${s}`;
            }, 1000);
        };

        const stopRecording = () => {
            if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
                state.mediaRecorder.stop();
            }
            state.isRecording = false;
            actionBtn.innerHTML = '<div class="w-6 h-6 bg-red-600 rounded-sm"></div>';
            actionBtn.classList.remove('border-red-800');
            recordingIndicator.classList.add('hidden');
            clearInterval(recordingInterval);
        };

        actionBtn.addEventListener('click', () => {
            if (state.mode === 'photo') {
                takePhoto();
            } else {
                if (!state.isRecording) startRecording();
                else stopRecording();
            }
        });

        const observer = new MutationObserver(() => {
            if (!document.body.contains(body)) {
                if (window.currentCameraStream) {
                    window.currentCameraStream.getTracks().forEach(track => track.stop());
                    window.currentCameraStream = null;
                }
                if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') state.mediaRecorder.stop();
                if (recordingInterval) clearInterval(recordingInterval);
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    };
    WM.create({ appId: 'camera', title: 'Camera', icon: Apps.icons.camera(14), width: 640, height: 520, content: render });
},

function escapeHtml(s) { if (typeof s !== 'string') return ''; return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function highlight(text, query) { if (!query) return text; const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); return text.replace(re, '<mark>$1</mark>'); }

const bootScreen = document.getElementById('boot-screen');
if (bootScreen && !bootScreen.classList.contains('hidden') && !Bios.isOpen) {
backtickCount++;
clearTimeout(backtickTimer);

}

function continueBootSequence() {
