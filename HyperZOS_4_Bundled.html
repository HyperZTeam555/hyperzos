/* matter.css */
.matter-button-contained{--matter-helper-theme:var(--matter-theme-rgb,var(--matter-primary-rgb,33,150,243));--matter-helper-ontheme:var(--matter-ontheme-rgb,var(--matter-onprimary-rgb,255,255,255));position:relative;display:inline-block;box-sizing:border-box;border:none;border-radius:4px;padding:0 16px;min-width:64px;height:36px;vertical-align:middle;text-align:center;text-overflow:ellipsis;color:rgb(var(--matter-helper-ontheme));background-color:rgb(var(--matter-helper-theme));box-shadow:0 3px 1px -2px rgba(0,0,0,0.2),0 2px 2px 0 rgba(0,0,0,0.14),0 1px 5px 0 rgba(0,0,0,0.12);font-family:var(--matter-font-family,"Roboto","Segoe UI",BlinkMacSystemFont,system-ui,-apple-system);font-size:14px;font-weight:500;line-height:36px;outline:none;cursor:pointer;transition:box-shadow 0.2s}.matter-button-contained::before,.matter-button-contained::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;opacity:0}.matter-button-contained::before{background-color:rgb(var(--matter-helper-ontheme));transition:opacity 0.2s}.matter-button-contained::after{background:radial-gradient(circle at center,currentColor 1%,transparent 1%) center/10000% 10000% no-repeat;transition:opacity 1s,background-size 0.5s}.matter-button-contained:hover,.matter-button-contained:focus{box-shadow:0 2px 4px -1px rgba(0,0,0,0.2),0 4px 5px 0 rgba(0,0,0,0.14),0 1px 10px 0 rgba(0,0,0,0.12)}.matter-button-contained:hover::before{opacity:0.08}.matter-button-contained:focus::before{opacity:0.24}.matter-button-contained:hover:focus::before{opacity:0.32}.matter-button-contained:active{box-shadow:0 5px 5px -3px rgba(0,0,0,0.2),0 8px 10px 1px rgba(0,0,0,0.14),0 3px 14px 2px rgba(0,0,0,0.12)}.matter-button-contained:active::after{opacity:0.32;background-size:100% 100%;transition:background-size 0s}.matter-button-contained:disabled{color:rgba(var(--matter-onsurface-rgb,0,0,0),0.38);background-color:rgba(var(--matter-onsurface-rgb,0,0,0),0.12);box-shadow:none;cursor:initial}.matter-button-contained:disabled::before,.matter-button-contained:disabled::after{opacity:0}

/* theme.css */
:root{--material-bg:#202124;--material-border:#444;--matter-surface-rgb:32,33,36;--matter-onsurface-rgb:255,255,255}.background{background-color:var(--material-bg)}.matter-switch{color:var(--theme-fg)!important}.matter-button-contained:not(.settingsIcon,.symbolButton){background-color:var(--theme-accent)!important}.matter-button-outlined{color:var(--theme-accent)!important}.matter-switch>input+span::before,.matter-switch>input+span::after{background-color:var(--theme-secondary-fg)!important}.matter-switch>input{background-color:var(--theme-secondary-bg)!important}.matter-switch>input:checked+span::before,.matter-switch>input:checked+span::after{background-color:var(--theme-accent)!important}.matter-switch>input:checked{background-color:color-mix(in srgb,var(--theme-accent) 75%,black 25%)!important}.matter-button-outlined{color:var(--theme-accent)!important;border-color:var(--theme-border)!important}.matter-button-outlined::before{background-color:color-mix(in srgb,var(--theme-accent) 75%,var(--theme-bg) 25%)!important}.matter-button-text{color:var(--theme-accent)!important}

/* bundle.css - window manager */
.aliceWMwin{user-select:none;-webkit-user-select:none;-ms-user-select:none;height:200px;width:500px;background:var(--theme-bg);position:fixed;overflow:hidden;z-index:91;display:flex;border:2px solid var(--material-border);flex-direction:column;box-shadow:0 4px 8px 0 rgba(0,0,0,0.2),0 6px 20px 0 rgba(0,0,0,0.19);border-radius:3px;transform:scale(1);transition:visibility 0s,opacity 0.15s cubic-bezier(0,0,0.4,1);opacity:1}.aliceWMwin svg{fill:var(--theme-fg);height:12px}.scaletransition{transition:visibility 0s,transform 0.15s cubic-bezier(0,0,0.4,1),opacity 0.15s cubic-bezier(0,0,0.4,1)}.opacity0.scaletransition{transform:scale(0.9)}.maxtransition{transition:width 0.2s,height 0.2s,top 0.2s,left 0.2s}#snapPreview{background-color:gray;opacity:50%;position:fixed;user-select:none;transition:opacity 0.2s;z-index:9999}.aliceWMwin .title{display:flex;background-color:var(--theme-bg);font-weight:bold;color:var(--theme-fg);height:24px;padding:2px;align-items:center;z-index:1}.aliceWMwin .titleContent{flex:1;font-size:13px;font-weight:400;padding:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.aliceWMwin .content{padding:2px;flex:1;background-color:var(--theme-bg)}.aliceWMwin .windowButton{background-color:transparent;color:var(--theme-fg);fill:var(--theme-fg);border:none;border-radius:100%;margin:2px;aspect-ratio:1/1;flex-shrink:0;transition:background-color 0.2s ease-in-out;z-index:2;display:flex;align-items:center;justify-content:center}.aliceWMwin .windowButton:hover{background-color:var(--theme-secondary-bg)}

/* launcher & taskbar */
#launcher-button-container{position:absolute;height:100%;aspect-ratio:1/1;width:auto;display:flex;align-items:center;justify-content:center;cursor:pointer}#taskbar-bar{display:flex;justify-content:center;align-items:center;height:48px}#taskbar-right{right:0.3em;top:50%;transform:translateY(-50%);position:absolute;height:70%;display:flex;gap:5px}#taskinfo-container,#date-container{background-color:var(--theme-secondary-bg);background:color-mix(in srgb,var(--theme-secondary-fg) 17.5%,transparent);padding-left:1em;padding-right:1em;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:500;line-height:1rem;border-radius:5px}#taskinfo-container{border-radius:5px 25px 25px 5px}#date-container{border-radius:25px 5px 5px 25px}footer{position:fixed;bottom:0;width:100%;background-color:color-mix(in srgb,var(--theme-dark-bg) 90%,transparent);border:1px solid var(--theme-dark-border);box-shadow:inset 0 0 0 1px var(--theme-border);border-bottom:none;backdrop-filter:blur(30px);border-left:none;border-right:none}

/* bootsplash */
.bootsplash{background-color:black;z-index:9999999999;position:absolute;width:100%;height:100%;top:0;left:0;display:flex;flex-direction:column;justify-content:center;align-content:center;text-align:center;color:white;flex-wrap:wrap;transition:0.175s;opacity:1;transform:scale(1)}.bootsplash.hide{opacity:0;pointer-events:none;transition:0.175s;transform:scale(1.25)}

/* context menu */
.custom-menu{position:absolute;background-color:var(--theme-secondary-bg);padding:5px 0;min-width:150px;max-width:250px;box-shadow:2px 2px 8px rgba(0,0,0,0.3);z-index:10000;overflow:hidden;padding:0;border-radius:3px}.custom-menu-item{display:flex;align-items:center;padding:8px 12px;font-size:13px;color:var(--theme-fg);cursor:pointer;user-select:none;transition:0.075s}.custom-menu-item:hover{background-color:color-mix(in srgb,var(--theme-fg) 5%,transparent);transition:0.05s}

/* alt tab */
.alttab-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:0.8em 1.5em;border-radius:1rem;background-color:color-mix(in srgb,var(--theme-dark-bg) 80%,transparent);backdrop-filter:blur(10px);color:var(--theme-fg);border:0.0125rem solid var(--theme-border)}.alttab-window{min-width:10rem;min-height:5.625rem;padding:1em;border:0.125rem solid transparent;border-radius:0.8rem;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;transition:0.1s border-color}.alttab-window-selected{border-color:var(--theme-accent)}

/* general */
html{background-color:black;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;padding:0;scrollbar-width:thin;color-scheme:dark}body{overflow:hidden;background:#000000;user-select:none;font-family:var(--theme-font-sans)}:root{--theme-font-sans:"Roboto",RobotoDraft,"Droid Sans",Arial,Helvetica,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--theme-font-mono:"Roboto Mono","Courier New",Courier,monospace}

<script>
// Enhanced app bundling system
window.BundledApps = {
  data: null,
  init() {
    try {
      this.data = JSON.parse(document.getElementById('bundled-apps').textContent);
      console.log('[Bundle] Loaded bundled apps:', Object.keys(this.data.apps));
      console.log('[Bundle] Loaded bundled libs:', Object.keys(this.data.libs));
    } catch (e) {
      console.error('[Bundle] Failed to parse bundled apps:', e);
    }
  },
  getApp(pkg) {
    return this.data?.apps?.[pkg] || null;
  },
  getLib(pkg) {
    return this.data?.libs?.[pkg] || null;
  },
  getAllApps() {
    return this.data?.apps || {};
  },
  getAllLibs() {
    return this.data?.libs || {};
  }
};

// Initialize bundled apps on DOMContentLoaded
document.addEventListener('DOMContentLoaded', () => {
  window.BundledApps.init();
});

// Override ExternalApp to support bundled apps
(function() {
  const originalFetch = window.fetch;
  window.fetch = function(url, options) {
    // Check if requesting bundled app resources
    if (url && typeof url === 'string') {
      if (url.startsWith('/apps/')) {
        // Let it through to the actual files
      }
    }
    return originalFetch.apply(this, arguments);
  };
})();

console.log('[HyperZOS 4 Bundled] System initialized with bundled apps');
</script>
